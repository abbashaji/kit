id: C-060
title: Square 10
goal: |
  sq60() -> int returns 100. One file, no tests file.
inputs:
  - from: C-000
    kind: implementation
    contract: |
      kit_demo package in src/kit_demo/.
provides:
  - "src/kit_demo/sw/q60.py: def sq60() -> int"
allowed_paths: [src/kit_demo/sw/q60.py]
outputs: [src/kit_demo/sw/q60.py]
acceptance:
  - cmd: "python -c \"import sys; sys.path.insert(0, 'src'); from kit_demo.sw.q60 import sq60; assert sq60() == 100\""
