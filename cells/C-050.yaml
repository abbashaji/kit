id: C-050
title: Triangular 30
goal: |
  tri50() -> int returns 465 (the 30th triangular number). One file, no tests file.
inputs:
  - from: C-000
    kind: implementation
    contract: |
      kit_demo package in src/kit_demo/.
provides:
  - "src/kit_demo/sw/s50.py: def tri50() -> int"
allowed_paths: [src/kit_demo/sw/s50.py]
outputs: [src/kit_demo/sw/s50.py]
acceptance:
  - cmd: "python -c \"import sys; sys.path.insert(0, 'src'); from kit_demo.sw.s50 import tri50; assert tri50() == 465\""
