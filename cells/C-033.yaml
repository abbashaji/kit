id: C-033
title: Triangular 13
goal: |
  tri33() -> int returns 91 (the 13th triangular number). One file, no tests file.
inputs:
  - from: C-000
    kind: implementation
    contract: |
      kit_demo package in src/kit_demo/.
provides:
  - "src/kit_demo/sw/s33.py: def tri33() -> int"
allowed_paths: [src/kit_demo/sw/s33.py]
outputs: [src/kit_demo/sw/s33.py]
acceptance:
  - cmd: "python -c \"import sys; sys.path.insert(0, 'src'); from kit_demo.sw.s33 import tri33; assert tri33() == 91\""
