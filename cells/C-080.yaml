id: C-080
title: Square 30
goal: |
  sq80() -> int returns 900. One file, no tests file.
inputs:
  - from: C-000
    kind: implementation
    contract: |
      kit_demo package in src/kit_demo/.
provides:
  - "src/kit_demo/sw/q80.py: def sq80() -> int"
allowed_paths: [src/kit_demo/sw/q80.py]
outputs: [src/kit_demo/sw/q80.py]
acceptance:
  - cmd: "python -c \"import sys; sys.path.insert(0, 'src'); from kit_demo.sw.q80 import sq80; assert sq80() == 900\""
