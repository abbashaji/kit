id: C-005
title: Temperature conversion
goal: |
  Functions c_to_f(c) and f_to_c(f) for floats; both return float. c_to_f(100) == 212.0, f_to_c(32) == 0.0.
inputs:
  - from: C-000
    kind: implementation
    contract: |
      Package kit_demo lives in src/kit_demo/; pytest is configured with pythonpath=src.
provides:
  - "src/kit_demo/temp.py: def c_to_f(c: float) -> float"
  - "src/kit_demo/temp.py: def f_to_c(f: float) -> float"
allowed_paths: [src/kit_demo/temp.py, tests/test_temp.py]
outputs: [src/kit_demo/temp.py, tests/test_temp.py]
acceptance:
  - cmd: "pytest tests/test_temp.py -q"
