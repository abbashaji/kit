id: C-049
title: Triangular 29
goal: |
  tri49() -> int returns 435 (the 29th triangular number). One file, no tests file.
inputs:
  - from: C-000
    kind: implementation
    contract: |
      kit_demo package in src/kit_demo/.
provides:
  - "src/kit_demo/sw/s49.py: def tri49() -> int"
allowed_paths: [src/kit_demo/sw/s49.py]
outputs: [src/kit_demo/sw/s49.py]
acceptance:
  - cmd: "python -c \"import sys; sys.path.insert(0, 'src'); from kit_demo.sw.s49 import tri49; assert tri49() == 435\""
