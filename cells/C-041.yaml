id: C-041
title: Triangular 21
goal: |
  tri41() -> int returns 231 (the 21th triangular number). One file, no tests file.
inputs:
  - from: C-000
    kind: implementation
    contract: |
      kit_demo package in src/kit_demo/.
provides:
  - "src/kit_demo/sw/s41.py: def tri41() -> int"
allowed_paths: [src/kit_demo/sw/s41.py]
outputs: [src/kit_demo/sw/s41.py]
acceptance:
  - cmd: "python -c \"import sys; sys.path.insert(0, 'src'); from kit_demo.sw.s41 import tri41; assert tri41() == 231\""
