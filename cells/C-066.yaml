id: C-066
title: Square 16
goal: |
  sq66() -> int returns 256. One file, no tests file.
inputs:
  - from: C-000
    kind: implementation
    contract: |
      kit_demo package in src/kit_demo/.
provides:
  - "src/kit_demo/sw/q66.py: def sq66() -> int"
allowed_paths: [src/kit_demo/sw/q66.py]
outputs: [src/kit_demo/sw/q66.py]
acceptance:
  - cmd: "python -c \"import sys; sys.path.insert(0, 'src'); from kit_demo.sw.q66 import sq66; assert sq66() == 256\""
