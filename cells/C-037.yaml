id: C-037
title: Triangular 17
goal: |
  tri37() -> int returns 153 (the 17th triangular number). One file, no tests file.
inputs:
  - from: C-000
    kind: implementation
    contract: |
      kit_demo package in src/kit_demo/.
provides:
  - "src/kit_demo/sw/s37.py: def tri37() -> int"
allowed_paths: [src/kit_demo/sw/s37.py]
outputs: [src/kit_demo/sw/s37.py]
acceptance:
  - cmd: "python -c \"import sys; sys.path.insert(0, 'src'); from kit_demo.sw.s37 import tri37; assert tri37() == 153\""
