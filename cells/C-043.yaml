id: C-043
title: Triangular 23
goal: |
  tri43() -> int returns 276 (the 23th triangular number). One file, no tests file.
inputs:
  - from: C-000
    kind: implementation
    contract: |
      kit_demo package in src/kit_demo/.
provides:
  - "src/kit_demo/sw/s43.py: def tri43() -> int"
allowed_paths: [src/kit_demo/sw/s43.py]
outputs: [src/kit_demo/sw/s43.py]
acceptance:
  - cmd: "python -c \"import sys; sys.path.insert(0, 'src'); from kit_demo.sw.s43 import tri43; assert tri43() == 276\""
